[project]
name = "astral-core"
version = "0.1.0"
description = "Shared models and storage for Astral Index"
authors = [
    { name = "Aaron Taylor", email = "git@ataylor.io" }
]
requires-python = ">=3.14"
dependencies = [
    "langdetect>=1.0.9",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
braintrust = ["braintrust>=0.0.160"]
phoenix = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-anthropic>=0.1",
    "arize-phoenix-client>=1.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
