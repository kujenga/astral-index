# Astral Index — RSS source configuration
# Tiers indicate feed reliability/richness (1 = best)

rss_sources:
  # --- Tier 1: Full-text feeds ---
  - name: "Universe Today"
    url: "https://universetoday.com/feed"
    content_type: full_text
    category_hints: [space_science]
    poll_interval_hours: 4

  # Parabolic Arc merged into SpaceNews (2023). Doug Messier now on Substack.
  - name: "Parabolic Arc (Doug Messier)"
    url: "https://douglasmmessier.substack.com/feed"
    content_type: full_text
    category_hints: [commercial_space, launch_vehicles, policy]
    poll_interval_hours: 4

  - name: "Behind the Black"
    url: "https://behindtheblack.com/feed/"
    content_type: full_text
    category_hints: [commercial_space, policy]
    poll_interval_hours: 4

  - name: "Casey Handmer"
    url: "https://caseyhandmer.wordpress.com/feed/"
    content_type: full_text
    category_hints: [commercial_space]
    poll_interval_hours: 4

  - name: "Centauri Dreams"
    url: "https://centauri-dreams.org/feed/"
    content_type: full_text
    category_hints: [deep_space]
    poll_interval_hours: 4

  - name: "NASA Watch"
    url: "https://nasawatch.com/feed/"
    content_type: full_text
    category_hints: [policy]
    poll_interval_hours: 4

  - name: "EarthSky"
    url: "https://earthsky.org/space/feed"
    content_type: full_text
    category_hints: [space_science]
    poll_interval_hours: 4

  # --- Tier 2: Excerpt-only feeds ---
  - name: "SpaceNews"
    url: "https://spacenews.com/feed/"
    content_type: excerpt
    category_hints: [commercial_space, policy]
    poll_interval_hours: 4
    is_paywalled: true

  - name: "Ars Technica Space"
    url: "https://arstechnica.com/space/feed/"
    content_type: excerpt
    category_hints: [launch_vehicles, commercial_space]
    poll_interval_hours: 6
    is_paywalled: true

  - name: "NASASpaceflight"
    url: "https://nasaspaceflight.com/feed"
    content_type: excerpt
    category_hints: [launch_vehicles, commercial_space]
    poll_interval_hours: 4

  - name: "Spaceflight Now"
    url: "https://spaceflightnow.com/feed/"
    content_type: excerpt
    category_hints: [launch_vehicles]
    poll_interval_hours: 4

  - name: "Space.com"
    url: "https://space.com/feeds.xml"
    content_type: excerpt
    category_hints: [space_science]
    poll_interval_hours: 4

  - name: "European Spaceflight"
    url: "https://europeanspaceflight.com/feed/"
    content_type: excerpt
    category_hints: [international]
    poll_interval_hours: 4

  - name: "Payload Space"
    url: "https://payloadspace.com/feed/"
    content_type: excerpt
    category_hints: [commercial_space]
    poll_interval_hours: 4

  - name: "The Space Review"
    url: "https://thespacereview.com/articles.xml"
    content_type: excerpt
    category_hints: [policy]
    poll_interval_hours: 4

  - name: "Planetary Society"
    url: "https://planetary.org/rss/articles"
    content_type: excerpt
    category_hints: [space_science]
    poll_interval_hours: 4

  - name: "SpacePolicy Online"
    url: "https://spacepolicyonline.com/feed"
    content_type: excerpt
    category_hints: [policy]
    poll_interval_hours: 4

  - name: "Everyday Astronaut"
    url: "https://everydayastronaut.com/feed/"
    content_type: excerpt
    category_hints: [launch_vehicles]
    poll_interval_hours: 4

  # --- Tier 3: Agency/institutional feeds ---
  - name: "NASA"
    url: "https://www.nasa.gov/feed/"
    content_type: excerpt
    category_hints: [space_science]
    poll_interval_hours: 4

  - name: "ESA Top News"
    url: "https://www.esa.int/rssfeed/TopNews"
    content_type: excerpt
    category_hints: [international]
    poll_interval_hours: 4

  - name: "JAXA Global"
    url: "https://global.jaxa.jp/rss/press.rdf"
    content_type: excerpt
    category_hints: [international]
    poll_interval_hours: 4

  - name: "Nature Astronomy"
    url: "https://www.nature.com/natastron.rss"
    content_type: excerpt
    category_hints: [space_science]
    poll_interval_hours: 4
    is_paywalled: true

  # --- Tier 4: Substack/newsletter feeds ---
  - name: "Jatan's Space"
    url: "https://jatan.space/rss/"
    content_type: full_text
    category_hints: [lunar, international]
    poll_interval_hours: 4

  - name: "Bad Astronomy"
    url: "https://badastronomy.beehiiv.com/feed"
    content_type: full_text
    category_hints: [space_science]
    poll_interval_hours: 4

  - name: "European Spaceflight Newsletter"
    url: "https://europeanspaceflight.substack.com/feed"
    content_type: full_text
    category_hints: [international]
    poll_interval_hours: 4

  # --- Tier 5: Category-specific feeds ---

  # Earth Observation
  - name: "NASA Earth Observatory"
    url: "https://earthobservatory.nasa.gov/feeds/earth-observatory.rss"
    content_type: excerpt
    category_hints: [earth_observation]
    poll_interval_hours: 4

  - name: "Geoawesome"
    url: "https://geoawesome.com/feed"
    content_type: excerpt
    category_hints: [earth_observation]
    poll_interval_hours: 4

  # Mars & Planetary Science
  - name: "NASA JPL News"
    url: "https://www.jpl.nasa.gov/feeds/news/"
    content_type: excerpt
    category_hints: [mars, deep_space]
    poll_interval_hours: 4

  - name: "Phys.org Planetary Sciences"
    url: "https://phys.org/rss-feed/space-news/planetary-sciences/"
    content_type: excerpt
    category_hints: [mars, space_science]
    poll_interval_hours: 4

  # Space Stations
  - name: "NASA Space Station Blog"
    url: "https://blogs.nasa.gov/spacestation/feed/"
    content_type: full_text
    category_hints: [iss_stations]
    poll_interval_hours: 4

  - name: "ISS National Lab"
    url: "https://issnationallab.org/feed/"
    content_type: full_text
    category_hints: [iss_stations]
    poll_interval_hours: 4

  # Defense & Military Space
  - name: "Breaking Defense"
    url: "https://breakingdefense.com/full-rss-feed/"
    content_type: full_text
    category_hints: [defense_space, policy]
    poll_interval_hours: 4

  - name: "U.S. Space Force"
    url: "https://www.spaceforce.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1060&max=10"
    content_type: excerpt
    category_hints: [defense_space]
    poll_interval_hours: 4

  - name: "Air & Space Forces Magazine"
    url: "https://www.airandspaceforces.com/feed/"
    content_type: excerpt
    category_hints: [defense_space]
    poll_interval_hours: 4

  # Satellite Communications
  - name: "Via Satellite"
    url: "https://www.satellitetoday.com/category/telecom/feed/"
    content_type: excerpt
    category_hints: [satellite_comms]
    poll_interval_hours: 4

  - name: "TMF Associates"
    url: "https://tmfassociates.com/blog/feed"
    content_type: full_text
    category_hints: [satellite_comms]
    poll_interval_hours: 4

  # Lunar Exploration
  - name: "NASA Artemis Blog"
    url: "https://www.nasa.gov/blogs/artemis/feed"
    content_type: full_text
    category_hints: [lunar]
    poll_interval_hours: 4

  - name: "Moon Daily"
    url: "https://www.moondaily.com/moondaily.xml"
    content_type: excerpt
    category_hints: [lunar]
    poll_interval_hours: 4

  # Deep Space & Planetary Science
  - name: "Astrobites"
    url: "https://astrobites.org/feed"
    content_type: full_text
    category_hints: [deep_space, space_science]
    poll_interval_hours: 4

  - name: "Phys.org Astronomy"
    url: "https://phys.org/rss-feed/space-news/astronomy/"
    content_type: excerpt
    category_hints: [deep_space, space_science]
    poll_interval_hours: 4

  # International Agencies
  - name: "Canadian Space Agency"
    url: "https://www.asc-csa.gc.ca/rss/default_eng.xml"
    content_type: full_text
    category_hints: [international]
    poll_interval_hours: 4

  - name: "UK Space Agency Blog"
    url: "https://space.blog.gov.uk/feed/"
    content_type: full_text
    category_hints: [international]
    poll_interval_hours: 4

  # --- Tier 6: Industry & independent analysis ---

  - name: "TechCrunch Space"
    url: "https://techcrunch.com/category/space/feed/"
    content_type: excerpt
    category_hints: [commercial_space]
    poll_interval_hours: 4
    is_paywalled: true

  - name: "Space Explored"
    url: "https://spaceexplored.com/feed/"
    content_type: full_text
    category_hints: [commercial_space, launch_vehicles]
    poll_interval_hours: 4

  - name: "New Space Economy"
    url: "https://newspaceeconomy.ca/feed"
    content_type: full_text
    category_hints: [commercial_space]
    poll_interval_hours: 4

  - name: "Ill-Defined Space"
    url: "https://illdefinedspace.substack.com/feed"
    content_type: full_text
    category_hints: [defense_space, commercial_space, policy]
    poll_interval_hours: 4

  - name: "Main Engine Cut Off"
    url: "https://mainenginecutoff.substack.com/feed"
    content_type: full_text
    category_hints: [policy, commercial_space]
    poll_interval_hours: 4

snapi:
  base_url: "https://api.spaceflightnewsapi.net/v4"
  endpoints:
    - /articles/
    - /blogs/
  poll_interval_hours: 4

reddit:
  subreddits: [space, spacex, astronomy, ula, rocketlab, BlueOrigin, spaceflight, astrophysics]
  score_threshold: 50
  limit: 50
  category_map:
    space: [space_science, launch_vehicles]
    spacex: [launch_vehicles, commercial_space]
    astronomy: [space_science, deep_space]
    ula: [launch_vehicles]
    rocketlab: [launch_vehicles, commercial_space]
    blueorigin: [launch_vehicles, commercial_space]
    spaceflight: [launch_vehicles]
    astrophysics: [space_science, deep_space]

arxiv:
  keyword_filter: true
  category_hints: [space_science]
  feeds:
    - name: "astro-ph.EP"
      url: "https://rss.arxiv.org/rss/astro-ph.EP"
    - name: "astro-ph.IM"
      url: "https://rss.arxiv.org/rss/astro-ph.IM"

bluesky:
  limit: 30
  accounts:
    - "planet4589.bsky.social"
    - "sciguyspace.bsky.social"
    - "jfoust.bsky.social"
    - "nasaspaceflight.bsky.social"
    - "nasawatch.bsky.social"
    - "spacepolicyonline.bsky.social"
    - "rocketlab.bsky.social"
    - "esa.bsky.social"
    - "spacenews.bsky.social"

twitter:
  limit: 20
  min_likes: 5
  accounts:
    - "planet4589"
    - "SciGuySpace"
    - "jeff_foust"
    - "NASASpaceflight"
    - "NASA"
    - "SpaceX"
    - "RocketLab"
    - "elabolatist"
    - "thesheetztweetz"
    - "waboratory"
